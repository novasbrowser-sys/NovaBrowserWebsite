<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact — NovaBrowser</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #08090d;
            color: white;
            min-height: 100vh;
        }

        nav {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            border-bottom: 1px solid #20222b;
            background: #0b0c11;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #6c63ff;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            margin-left: 30px;
        }

        nav a:hover {
            color: white;
        }

        .content {
            max-width: 800px;
            margin: auto;
            padding: 100px 25px;
            text-align: center;
        }

        h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 span {
            color: #6c63ff;
        }

        .intro {
            color: #a5a5b0;
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 50px;
        }

        .contact-box {
            background: #151720;
            border: 1px solid #252836;
            border-radius: 20px;
            padding: 40px;
        }

        .contact-box h2 {
            margin-bottom: 15px;
        }

        .contact-box p {
            color: #999daa;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .email {
            display: inline-block;
            padding: 15px 25px;
            background: #6c63ff;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
        }

        .email:hover {
            background: #8179ff;
        }

        .back {
            display: block;
            text-align: center;
            color: #888;
            text-decoration: none;
            margin: 20px 0 50px;
        }

        .back:hover {
            color: white;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
            border-top: 1px solid #20222b;
        }

        @media (max-width: 700px) {
            nav {
                padding: 0 20px;
            }

            nav a {
                margin-left: 10px;
            }

            h1 {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">
            Nova<span>Browser</span>
        </div>

        <div>
            <a href="../index.html">Home</a>
            <a href="features.html">Features</a>
            <a href="about.html">About</a>
            <a href="download.html">Download</a>
        </div>
    </nav>

    <main class="content">

        <h1>Contact <span>NovaBrowser</span></h1>

        <p class="intro">
            Have a question, suggestion or feedback?
            We'd love to hear from you.
        </p>

        <div class="contact-box">

            <h2>Get in touch</h2>

            <p>
                Have a question, suggestion or feedback
                Email us and we'll get back to you.
            </p>

            <a class="email" href="mailto:novas.browser@gmail.com">
                Contact Us
            </a>

        </div>

    </main>

    <a class="back" href="../index.html">
        ← Back to NovaBrowser
    </a>

    <footer>
        © 2026 NovaBrowser. All rights reserved.
    </footer>

</body>
</html>
