<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Download NovaBrowser</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #08090d;
            color: white;
            min-height: 100vh;
        }

        nav {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            border-bottom: 1px solid #20222b;
            background: #0b0c11;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #6c63ff;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            margin-left: 30px;
        }

        nav a:hover {
            color: white;
        }

        .content {
            min-height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }

        .box {
            max-width: 700px;
        }

        h1 {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 span {
            color: #6c63ff;
        }

        p {
            color: #a5a5b0;
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .download {
            display: inline-block;
            padding: 16px 35px;
            background: #6c63ff;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 17px;
        }

        .download:hover {
            background: #8179ff;
        }

        .back {
            display: block;
            margin-top: 25px;
            color: #888;
            text-decoration: none;
        }

        .back:hover {
            color: white;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">
            Nova<span>Browser</span>
        </div>

        <div>
            <a href="../index.html">Home</a>
            <a href="../index.html#features">Features</a>
        </div>
    </nav>

    <main class="content">
        <div class="box">

            <h1>Download <span>NovaBrowser</span></h1>

            <p>
                NovaBrowser is currently being built.
                The Windows version will be available here when it's ready.
            </p>

            <a class="download" href="#">
                Coming Soon
            </a>

            <a class="back" href="../index.html">
                ← Back to NovaBrowser
            </a>

        </div>
    </main>

</body>
</html>
